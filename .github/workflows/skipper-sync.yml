# Verificarea grupelor de pe skipper, din 15 în 15 minute.
#
# Vercel Cron pe planul hobby rulează cel mult o dată pe zi, așa că declanșatorul
# de 15 minute stă aici. Ruta face toată treaba; asta doar o cheamă.
name: Sincronizare skipper

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:        # se poate porni și manual, din tab-ul Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Cheamă /api/cron/skipper-sync
        run: |
          cod=$(curl -sS -m 120 -o raspuns.json -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://setsail-practica.vercel.app/api/cron/skipper-sync)
          echo "HTTP $cod"
          cat raspuns.json
          test "$cod" = "200"
